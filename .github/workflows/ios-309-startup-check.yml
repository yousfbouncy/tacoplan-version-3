name: Validate Tacoplan iOS 3.0.9 startup recovery
on:
  push:
    branches:
      - fix/ios-expo-updates-startup-309
  workflow_dispatch:
jobs:
  verify-ios-309:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check a fresh native runtime and safe iOS startup settings
        run: |
          node - <<'NODE'
          const e = require('./app.json').expo;
          const eas = require('./eas.json');
          if (e.version !== '3.0.9' || e.ios.buildNumber !== '15' ||
              e.runtimeVersion?.policy !== 'appVersion' ||
              e.ios.bundleIdentifier !== 'com.tacoplan' ||
              e.updates.checkAutomatically !== 'NEVER' ||
              eas.build.production.channel !== 'production')
            throw Error('iOS runtime/startup checks failed');
          NODE
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
