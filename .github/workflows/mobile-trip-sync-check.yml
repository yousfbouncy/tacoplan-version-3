name: Mobile trip sync typecheck
on:
  push:
    branches: [main]
    paths:
      - 'app/(tabs)/index.tsx'
      - 'components/WebBrowserTripAlerts.tsx'
      - 'components/RequiredAppPermissions.tsx'
      - 'lib/native-alarm-plan-signature.ts'
      - 'tests/native-alarm-plan-signature.test.ts'
      - 'lib/browser-trip-notifications.ts'
      - 'lib/native-trip-alert.ts'
      - 'tests/browser-trip-notifications.test.ts'
      - 'lib/sync-service.ts'
      - 'lib/local-storage.ts'
      - 'lib/shift-periods.ts'
      - 'lib/availability-context.ts'
      - 'tests/shift-periods.test.ts'
      - 'lib/trip-navigation.ts'
      - 'app/viaje-detalle.tsx'
      - 'app/_layout.tsx'
      - 'components/RequiredAppPermissions.tsx'
      - 'lib/native-alarm-plan-signature.ts'
      - 'tests/native-alarm-plan-signature.test.ts'
      - 'plugins/withTrafficAlertSound.js'
      - 'app.json'
      - 'tests/trip-navigation.test.ts'
      - '.github/workflows/mobile-trip-sync-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/(tabs)/index.tsx'
      - 'components/WebBrowserTripAlerts.tsx'
      - 'components/RequiredAppPermissions.tsx'
      - 'lib/native-alarm-plan-signature.ts'
      - 'tests/native-alarm-plan-signature.test.ts'
      - 'lib/browser-trip-notifications.ts'
      - 'lib/native-trip-alert.ts'
      - 'tests/browser-trip-notifications.test.ts'
      - 'lib/sync-service.ts'
      - 'lib/local-storage.ts'
      - 'lib/shift-periods.ts'
      - 'lib/availability-context.ts'
      - 'tests/shift-periods.test.ts'
      - 'app/(tabs)/viajes.tsx'
      - 'app/viaje-detalle.tsx'
      - 'app/_layout.tsx'
      - 'components/RequiredAppPermissions.tsx'
      - 'lib/native-alarm-plan-signature.ts'
      - 'tests/native-alarm-plan-signature.test.ts'
      - 'plugins/withTrafficAlertSound.js'
      - 'app.json'
      - '.github/workflows/mobile-trip-sync-check.yml'
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node -e "require('./plugins/withTrafficAlertSound'); const fs=require('fs'); const sound=fs.readFileSync('assets/sounds/tacoplan_viaje_3.wav'); if (sound.toString('ascii',0,4)!=='RIFF') process.exit(1)"
      - run: npm run typecheck
      - run: node --import tsx --test tests/trip-navigation.test.ts tests/browser-trip-notifications.test.ts tests/shift-periods.test.ts
