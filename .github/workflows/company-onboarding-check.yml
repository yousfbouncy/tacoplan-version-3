name: Verify employer onboarding mobile
on:
  push:
    branches: [fix/company-onboarding-native-gate-20261115]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
