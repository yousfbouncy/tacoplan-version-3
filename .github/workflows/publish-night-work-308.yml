name: Publish diet continuity and nocturnity 3.0.8 OTA
on:
  push:
    branches:
      - feature/crossday-60-night-premium-308
    paths:
      - .github/workflows/publish-night-work-308.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Ensure compatible OTA runtime and existing channels
        run: |
          node - <<'NODE'
          const a=require('./app.json').expo,e=require('./eas.json');
          if(a.version!=='3.0.8'||a.runtimeVersion?.policy!=='appVersion'||a.updates?.enabled!==true||
             e.build?.preview?.channel!=='preview'||e.build?.production?.channel!=='production')
            throw Error('OTA app/runtime mismatch');
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Confirm Expo authentication
        run: |
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN missing' && exit 1)
          npx --yes eas-cli whoami
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
        channel: [production, preview]
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://dutgxjwfjtqxmqonnjlp.supabase.co/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish 3.0.8 ${{ matrix.platform }} ${{ matrix.channel }}
        run: |
          npx --yes eas-cli update --channel ${{ matrix.channel }} --platform ${{ matrix.platform }} --non-interactive --message "Tacoplan 3.0.8: dieta continuidad 60%, nocturnidad mensual e historial"
