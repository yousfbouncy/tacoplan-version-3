name: Validate Tacoplan 3.0.6 OTA
on:
  push:
    branches:
      - ota-android-3.0.6-free-restrictions
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify original 3.0.6 runtime and sounds
        run: |
          node -e "const e=require('./app.json').expo;const c=require('./eas.json');if(e.version!=='3.0.6'||e.runtimeVersion?.policy!=='appVersion'||!e.updates?.enabled||c.build.preview.channel!=='preview')process.exit(1)"
          node -e "const e=require('./app.json').expo;const s=e.plugins.find(p=>Array.isArray(p)&&p[0]==='expo-notifications')?.[1]?.sounds||[];if(JSON.stringify(s)!==JSON.stringify(['./assets/sounds/tacoplan_viaje.wav']))process.exit(1)"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
