name: Verify AutoStart REST and driving counters
on:
  push:
    branches:
      - feature/auto-rest-break-and-driving-totals-308
    paths:
      - .github/workflows/verify-auto-rest-and-driving-totals.yml
      - lib/driver-activities.ts
      - lib/autostart/driving.ts
      - components/DriverActivityPanel.tsx
      - tests/driver-activities.test.ts
      - tests/driving-auto-runtime.test.ts
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
