name: Verify and publish nocturnity placement and historical fix OTA
on:
  push:
    branches: [fix/night-plus-inside-dietas-and-restore-hours]
    paths: [.github/workflows/publish-night-placement-308.yml]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env: {EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Verify OTA compatibility and credentials
        run: |
          node - <<'NODE'
          const a=require('./app.json').expo,e=require('./eas.json');
          if(a.version!=='3.0.8'||a.runtimeVersion?.policy!=='appVersion'||!a.updates?.enabled||e.build?.production?.channel!=='production'||e.build?.preview?.channel!=='preview')
           throw Error('Incompatible runtime');
          NODE
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli whoami
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
        channel: [production, preview]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://dutgxjwfjtqxmqonnjlp.supabase.co/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx --yes eas-cli update --channel ${{ matrix.channel }} --platform ${{ matrix.platform }} --non-interactive --message "Tacoplan 3.0.8: nocturnidad en Extras y pluses; reparar horas historicas y ajuste manual"
