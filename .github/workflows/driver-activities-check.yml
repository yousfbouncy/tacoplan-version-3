name: Verify driver activity controls
on:
  push:
    branches: [main]
    paths:
      - 'components/DriverActivityPanel.tsx'
      - 'lib/driver-activities.ts'
      - 'lib/autostart/**'
      - 'app/autostart.tsx'
      - 'tests/autostart-task.test.ts'
      - 'tests/autostart-engine.test.ts'
      - 'app/_layout.tsx'
      - 'app/(tabs)/index.tsx'
      - 'tests/driver-activities.test.ts'
      - '.github/workflows/driver-activities-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/DriverActivityPanel.tsx'
      - 'lib/driver-activities.ts'
      - 'tests/driver-activities.test.ts'
      - 'app/(tabs)/index.tsx'
      - '.github/workflows/driver-activities-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
