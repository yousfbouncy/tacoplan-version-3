name: Verify driver activity controls
on:
  push:
    branches: [main]
    paths:
      - 'components/DriverActivityPanel.tsx'
      - 'components/OnboardingSetup.tsx'
      - 'lib/account-email.ts'
      - 'tests/account-email.test.ts'
      - 'components/JornadaActivityHistory.tsx'
      - 'app/(tabs)/historial.tsx'
      - 'app/(tabs)/_layout.tsx'
      - 'components/HeaderMenuButton.tsx'
      - 'lib/driver-activities.ts'
      - 'lib/local-storage.ts'
      - 'lib/legalEngine.ts'
      - 'lib/weekly-compensation.ts'
      - 'tests/weekly-compensation.test.ts'
      - 'lib/period-audit-actions.ts'
      - 'tests/period-audit-actions.test.ts'
      - 'lib/autostart/**'
      - 'app/autostart.tsx'
      - 'tests/autostart-task.test.ts'
      - 'tests/autostart-engine.test.ts'
      - 'app/_layout.tsx'
      - 'app/(tabs)/index.tsx'
      - 'tests/driver-activities.test.ts'
      - '.github/workflows/driver-activities-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/DriverActivityPanel.tsx'
      - 'components/OnboardingSetup.tsx'
      - 'lib/account-email.ts'
      - 'tests/account-email.test.ts'
      - 'components/JornadaActivityHistory.tsx'
      - 'app/(tabs)/historial.tsx'
      - 'app/(tabs)/_layout.tsx'
      - 'components/HeaderMenuButton.tsx'
      - 'lib/driver-activities.ts'
      - 'lib/local-storage.ts'
      - 'lib/legalEngine.ts'
      - 'lib/weekly-compensation.ts'
      - 'tests/weekly-compensation.test.ts'
      - 'lib/period-audit-actions.ts'
      - 'tests/period-audit-actions.test.ts'
      - 'tests/driver-activities.test.ts'
      - 'app/(tabs)/index.tsx'
      - '.github/workflows/driver-activities-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/account-email.test.ts tests/weekly-compensation.test.ts tests/period-audit-actions.test.ts
      - run: npm run typecheck
      - run: npm test
