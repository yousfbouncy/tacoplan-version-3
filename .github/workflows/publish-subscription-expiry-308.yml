name: Publish Tacoplan subscription expiry reminders 3.0.8 OTA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-subscription-expiry-308.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Verify 3.0.8 runtime and OTA channels
        run: |
          node - <<'NODE'
          const app=require('./app.json').expo,eas=require('./eas.json');
          if(app.version!=='3.0.8' || app.runtimeVersion?.policy!=='appVersion' ||
             app.updates?.enabled!==true || eas.build.production.channel!=='production' ||
             eas.build.preview.channel!=='preview') throw Error('OTA runtime/channel mismatch');
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Check Expo credentials
        run: |
          test -n "$EXPO_TOKEN" || (echo "EXPO_TOKEN missing" && exit 1)
          npx --yes eas-cli whoami
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
        channel: [production, preview]
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://dutgxjwfjtqxmqonnjlp.supabase.co/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish subscription reminder popup to ${{ matrix.platform }} ${{ matrix.channel }}
        run: |
          npx --yes eas-cli update --channel ${{ matrix.channel }} --platform ${{ matrix.platform }} --non-interactive --message "Tacoplan 3.0.8: recordatorio de suscripción solo si el usuario sigue sin plan activo"
